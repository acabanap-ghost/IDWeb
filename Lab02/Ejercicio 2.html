<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
<form action="registrar" method="post">
    <fieldset>
        <legend>Informacion personal</legend>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required><br><br>
        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" required><br><br>
        <label for="fecha">Fecha de nacimiento</label>
        <input type="date" id="fecha" name="fecha" min="1950-01-01" max="2010-12-31" required><br><br>
        <label for"edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="15" max="99" required><br><br>
        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" rows="3" cols="30"></textarea>
    </fieldset>
    <br>
    <fieldset>
        <legend>Informacion de la cuenta</legend>
        <label for="codigo">Codigo de estudiante</label>
        <input type="text" id="codigo" name="codigo" pattern="[0-9]{8}" title="debe tener 8 digitos"
        required><br><br>
        <label for="pasword">Contraseña:</label>
        <input type="password" id="password" name="pasword"
        pattern="(?=.*[A-Z])(?=.*[0-9].{8,})"
        title="Minimo introducir 8 caracteres, al menos una mayuscula y un numero"
        required><br><br>
    </fieldset>
</form>
</body>
</html>
